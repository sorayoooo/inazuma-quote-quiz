<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日の格言タイムアタック</title><style>
:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#edf6ff;background:#081a37}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#194e83,#081a37 70%)}main{max-width:720px;margin:auto;padding:24px 16px 70px}.panel{background:#112d54;border:1px solid #38608d;border-radius:18px;padding:22px;box-shadow:0 15px 40px #0003}h1{font-size:clamp(25px,6vw,38px);margin:8px 0}h2{font-size:23px}p{line-height:1.7}.muted{color:#a9c8e7}.small{font-size:13px}.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0}button{font:inherit;cursor:pointer;border:1px solid #6c9fd1;border-radius:12px;background:#1a4678;color:#fff;padding:13px 12px;font-weight:700;min-height:48px}button:hover{background:#245a97}button:disabled{opacity:.55;cursor:default}.mode.active{background:#f9c941;color:#152944;border-color:#ffe389}.primary{background:#ffcf4d;color:#132847;border:0;width:100%;font-size:19px}.primary:hover{background:#ffdb78}input{width:100%;padding:13px;background:#0c2445;color:white;border:1px solid #6c9fd1;border-radius:10px;font-size:16px}.hide{display:none!important}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.quote{font-size:clamp(21px,5vw,29px);line-height:1.7;font-weight:800;text-align:center;padding:24px 6px;min-height:145px;display:grid;place-items:center}.answers{display:grid;gap:10px}.answers button{text-align:left;font-size:15px;font-weight:600}.answers button.wrong{background:#883448;border-color:#ef6c80}.pill{background:#244e80;border-radius:30px;padding:7px 13px;font-size:13px}.countdown{font-size:95px;text-align:center;font-weight:900;color:#ffd34d}.resulttime{font-size:52px;text-align:center;font-weight:900;color:#ffdc76}a{color:#9ed4ff}.note{background:#173e69;border-radius:12px;padding:12px;margin:16px 0}.foot{font-size:12px;color:#aac1d9;text-align:center;margin-top:22px}
</style></head><body><main><header style="text-align:center;margin:14px 0 24px"><div>⚡ INAZUMA ELEVEN ⚡</div><h1>今日の格言タイムアタック</h1><div class="muted">格言が登場した話数とサブタイトルを当てろ！</div></header>
<section class="panel" id="setup"><h2>ゲーム設定</h2><label for="nickname">ニックネーム</label><input id="nickname" maxlength="16" placeholder="ニックネームを入力" autocomplete="nickname"><p class="muted">問題数を選んでね</p><div class="modes" id="modes"><button class="mode active" data-n="15">15問</button><button class="mode" data-n="30">30問</button><button class="mode" data-n="50">50問</button><button class="mode" data-n="125">全125問</button></div><button class="primary" id="start">スタート</button><p id="error" class="small" role="alert"></p><div class="note small">不正解は1回につき＋2秒。正解するまで次へ進めません。問題順と選択肢は毎回ランダムです。</div></section>
<section class="panel hide" id="count"><div class="muted" style="text-align:center">まもなくスタート！</div><div class="countdown" id="number">5</div></section>
<section class="panel hide" id="game"><div class="bar"><span class="pill" id="progress"></span><span class="pill" id="timer">0.00秒</span></div><div class="muted" style="text-align:center">この「今日の格言」が登場したのは？</div><div class="quote" id="quote"></div><div class="answers" id="answers"></div><p id="penalty" class="small muted" aria-live="polite"></p></section>
<section class="panel hide" id="result"><h2 style="text-align:center">⚡ 完走！ ⚡</h2><div id="summary" style="text-align:center"></div><div class="resulttime" id="finaltime"></div><p id="breakdown" style="text-align:center" class="muted"></p><div class="note" id="best"></div><p class="muted small">全国ランキングは次のステップでSupabaseに接続します。現在はこのブラウザ内の自己ベストのみ保存します。</p><button class="primary" id="again">もう一度遊ぶ</button><p><button style="width:100%" id="share">Xで結果を共有</button></p></section><p class="foot">非公式ファン制作クイズ／問題データ：ユーザー提供の格言一覧</p></main>
<script>
'use strict';let all=[],selectedCount=15,round=[],index=0,mistakes=0,startTime=0,tick=null,locked=false,choices=[];const $=id=>document.getElementById(id);const sections=['setup','count','game','result'];const show=id=>sections.forEach(x=>$(x).classList.toggle('hide',x!==id));const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const seconds=()=>((performance.now()-startTime)/1000+mistakes*2);const fmt=n=>n.toFixed(2)+'秒';
fetch('./questions.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{if(!Array.isArray(data)||data.length!==125||new Set(data.map(x=>x.episode)).size!==125||data.some(x=>!x.quote||!x.answer))throw Error('問題データに不備があります');all=data}).catch(e=>{$('error').textContent='問題データを読み込めませんでした。questions.json の配置を確認してください。'+e.message});
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{selectedCount=Number(b.dataset.n);document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b))}));
$('start').addEventListener('click',async()=>{if(all.length!==125){$('error').textContent='問題データを読み込み中です。少し待って再度お試しください。';return}let name=$('nickname').value.trim();if(!name){$('error').textContent='ニックネームを入力してください';return}localStorage.setItem('quote_nickname',name);$('error').textContent='';round=shuffle(all).slice(0,selectedCount);index=0;mistakes=0;show('count');for(let n=5;n>=1;n--){$('number').textContent=n;await new Promise(r=>setTimeout(r,1000))}startTime=performance.now();show('game');tick=setInterval(()=>{$('timer').textContent=fmt(seconds())},50);render()});$('nickname').value=localStorage.getItem('quote_nickname')||'';
function render(){locked=false;let q=round[index];$('progress').textContent=`${index+1} / ${round.length} 問`;$('quote').textContent=q.quote;$('penalty').textContent=`誤答 ${mistakes} 回（+${mistakes*2}秒）`;let wrong=shuffle(all.filter(x=>x.episode!==q.episode)).slice(0,3);choices=shuffle([q,...wrong]);$('answers').replaceChildren();choices.forEach((c,i)=>{let b=document.createElement('button');b.textContent='ABCD'[i]+'. '+c.answer;b.onclick=()=>{if(locked)return;if(c.episode!==q.episode){mistakes++;b.classList.add('wrong');$('penalty').textContent=`誤答 ${mistakes} 回（+${mistakes*2}秒）`;return}locked=true;index++;if(index>=round.length)finish();else render()};$('answers').appendChild(b)})}
function finish(){clearInterval(tick);let time=seconds(),name=$('nickname').value.trim(),key='quote_best_'+selectedCount;let old=Number(localStorage.getItem(key));if(!old||time<old)localStorage.setItem(key,String(time));$('summary').textContent=`${name}｜${selectedCount}問モード`;$('finaltime').textContent=fmt(time);$('breakdown').textContent=`誤答 ${mistakes} 回（ペナルティ +${mistakes*2}秒）`;$('best').textContent=`このブラウザの自己ベスト：${fmt(Number(localStorage.getItem(key)))}`;window.lastResult={name,time,mode:selectedCount,mistakes};show('result')}
$('again').onclick=()=>show('setup');$('share').onclick=()=>{let r=window.lastResult;if(!r)return;let t=`⚡イナズマイレブン 今日の格言タイムアタック\n${r.mode}問モード ${fmt(r.time)}（誤答${r.mistakes}回）\n#イナズマイレブン #今日の格言\n${location.href}`;window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(t),'_blank','noopener,noreferrer')};
</script></body></html>
