<script>
'use strict';const SUPABASE_URL='https://jpsmqllyqqslzuuzztbb.supabase.co';const SUPABASE_KEY='sb_publishable_ln5auYbiN758imNzEaoBlg_y61jOKdi';const API=SUPABASE_URL+'/rest/v1/';let session=null,rankMode='15';let all=[],selectedCount=15,round=[],index=0,mistakes=0,startTime=0,tick=null,locked=false,choices=[];const $=id=>document.getElementById(id);const sections=['setup','count','game','result'];const show=id=>sections.forEach(x=>$(x).classList.toggle('hide',x!==id));const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const seconds=()=>((performance.now()-startTime)/1000+mistakes*2);const fmt=n=>n.toFixed(2)+'秒';
all=JSON.parse(document.getElementById('embeddedQuestions').textContent);$('error').textContent='問題データ125問 読み込み完了';

$('start').addEventListener('click',async()=>{if(all.length!==125){$('error').textContent='問題データを読み込み中です。少し待って再度お試しください。';return}let name=$('nickname').value.trim();if(!name){$('error').textContent='ニックネームを入力してください';return}localStorage.setItem('quote_nickname',name);$('error').textContent='';round=shuffle(all).slice(0,selectedCount);index=0;mistakes=0;show('count');for(let n=5;n>=1;n--){$('number').textContent=n;await new Promise(r=>setTimeout(r,1000))}startTime=performance.now();show('game');tick=setInterval(()=>{$('timer').textContent=fmt(seconds())},50);render()});$('nickname').value=localStorage.getItem('quote_nickname')||'';
function render(){locked=false;let q=round[index];$('progress').textContent=`${index+1} / ${round.length} 問`;$('quote').textContent=q.quote;$('penalty').textContent=`誤答 ${mistakes} 回（+${mistakes*2}秒）`;let wrong=shuffle(all.filter(x=>x.episode!==q.episode)).slice(0,3);choices=shuffle([q,...wrong]);$('answers').replaceChildren();choices.forEach((c,i)=>{let b=document.createElement('button');b.textContent='ABCD'[i]+'. '+c.answer;b.onclick=()=>{if(locked)return;if(c.episode!==q.episode){if(b.classList.contains('wrong'))return;mistakes++;b.classList.add('wrong');$('penalty').textContent=`誤答 ${mistakes} 回（+${mistakes*2}秒）`;return}locked=true;index++;if(index>=round.length)finish();else render()};$('answers').appendChild(b)})}
async function finish(){clearInterval(tick);let time=seconds(),name=$('nickname').value.trim(),key='quote_best_'+selectedCount;let old=Number(localStorage.getItem(key));if(!old||time<old)localStorage.setItem(key,String(time));$('summary').textContent=`${name}｜${selectedCount}問モード`;$('finaltime').textContent=fmt(time);$('breakdown').textContent=`誤答 ${mistakes} 回（ペナルティ +${mistakes*2}秒）`;$('best').textContent=`このブラウザの自己ベスト：${fmt(Number(localStorage.getItem(key)))}`;window.lastResult={name,time,mode:selectedCount,mistakes};show('result');$('uploadStatus').textContent='全国ランキングへ送信中…';$('myRank').textContent='';await submitResult(name,selectedCount,time)}

async function req(path,opts={}){const headers={'apikey':SUPABASE_KEY,'Content-Type':'application/json',...opts.headers};if(session?.access_token)headers.Authorization='Bearer '+session.access_token;const r=await fetch(path,{...opts,headers});let data=null;try{data=await r.json()}catch{}if(!r.ok)throw Error(data?.message||data?.msg||data?.error_description||('HTTP '+r.status));return data}
async function ensureSession(){if(session?.access_token && Date.now()<session.expires_at*1000-60000)return session;let stored;try{stored=JSON.parse(localStorage.getItem('quote_auth_session')||'null')}catch{}if(stored?.refresh_token){try{let refreshed=await req(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:stored.refresh_token})});session={...refreshed,expires_at:Math.floor(Date.now()/1000)+refreshed.expires_in};localStorage.setItem('quote_auth_session',JSON.stringify(session));return session}catch{}}let a=await req(SUPABASE_URL+'/auth/v1/signup',{method:'POST',body:JSON.stringify({})});if(!a.access_token||!a.user?.id)throw Error('匿名認証が利用できません。SupabaseのAnonymous Sign-Insを有効にしてください');session={...a,expires_at:Math.floor(Date.now()/1000)+a.expires_in};localStorage.setItem('quote_auth_session',JSON.stringify(session));return session}
const modeKey=n=>n===125?'all':String(n);
async function submitResult(name,mode,time){try{await ensureSession();let ms=Math.max(0,Math.round(time*1000));let data=await req(API+'rpc/submit_quote_score',{method:'POST',body:JSON.stringify({p_nickname:name,p_mode:modeKey(mode),p_time_ms:ms})});$('uploadStatus').textContent='全国ランキングへの記録送信が完了しました。';$('myRank').textContent=`全国 ${data.rank}位 / ${data.participants}人中（自己ベスト ${fmt(data.best_time_ms/1000)}）`;window.lastResult.rank=data.rank;window.lastResult.participants=data.participants;await loadRanking(modeKey(mode))}catch(e){$('uploadStatus').textContent='全国ランキングの送信に失敗しました：'+e.message+'（ブラウザ内の記録は保存済み）'}}
async function loadRanking(mode){rankMode=mode;document.querySelectorAll('#rankModes button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('rankStatus').textContent='読み込み中…';$('rankList').replaceChildren();try{let rows=await req(API+'quote_rankings?select=nickname,time_ms,player_id&mode=eq.'+encodeURIComponent(mode)+'&order=time_ms.asc&limit=20');let count=await req(API+'rpc/count_quote_players',{method:'POST',body:JSON.stringify({p_mode:mode})});$('rankStatus').textContent=`参加人数 ${count}人｜上位20位まで表示`;rows.forEach((r,i)=>{let li=document.createElement('li');let left=document.createElement('span');left.textContent=`${i+1}位  ${r.nickname}`;let right=document.createElement('strong');right.textContent=fmt(r.time_ms/1000);li.append(left,right);$('rankList').appendChild(li)})}catch(e){$('rankStatus').textContent='ランキングを読み込めません：'+e.message}}
for(const [m,label] of [['15','15問'],['30','30問'],['50','50問'],['all','全125問']]){let b=document.createElement('button');b.dataset.mode=m;b.textContent=label;b.onclick=()=>loadRanking(m);$('rankModes').appendChild(b)}loadRanking('15');
$('again').onclick=()=>show('setup');$('share').onclick=()=>{let r=window.lastResult;if(!r)return;let t=`⚡イナズマイレブン 今日の格言タイムアタック\n${r.mode}問モード ${fmt(r.time)}（誤答${r.mistakes}回）${r.rank?'\n全国順位：'+r.rank+'位 / 全体'+r.participants+'人':'\n全国順位：未取得'}\n#イナズマイレブン #今日の格言 #今日の格言タイムアタック\n${location.href}`;window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(t),'_blank','noopener,noreferrer')};
